# Blueprint do Render — publica o app direto deste repositório.
# Em https://dashboard.render.com → New → Blueprint → conecte este repo.
services:
  - type: web
    name: caca-passagens-gyn-mcz
    runtime: python
    plan: free
    branch: claude/flight-deals-goiania-maceio-wg7zbl
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # "auto" usa a Amadeus automaticamente quando as chaves abaixo existirem;
      # sem chaves, cai no modo demonstração. Não precisa mexer aqui.
      - key: FF_PROVIDER
        value: auto
      # Host da Amadeus. TESTE tem dados limitados (pode não ter GYN-MCZ).
      # Para dados reais use: https://api.amadeus.com (chaves de produção).
      - key: AMADEUS_HOST
        value: https://test.api.amadeus.com
      # Preencha no painel do Render (Environment). sync:false = não versiona segredos.
      - key: AMADEUS_CLIENT_ID
        sync: false
      - key: AMADEUS_CLIENT_SECRET
        sync: false
