# Blueprint do Render — publica o app direto deste repositório.
# Em https://dashboard.render.com → New → Blueprint → conecte este repo.
services:
  - type: web
    name: caca-passagens-gyn-mcz
    runtime: python
    plan: free
    branch: claude/flight-deals-goiania-maceio-wg7zbl
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Provedor de dados: "demo" (sem credenciais) ou "amadeus" (preços reais).
      - key: FF_PROVIDER
        value: demo
      # Para preços reais, troque FF_PROVIDER para "amadeus" e preencha estas
      # variáveis no painel do Render (deixe sync:false para não versionar segredos).
      - key: AMADEUS_CLIENT_ID
        sync: false
      - key: AMADEUS_CLIENT_SECRET
        sync: false
